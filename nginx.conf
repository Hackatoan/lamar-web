server_tokens off;

# Compression: nginx:alpine ships gzip off by default, so this static
# site was serving every HTML/CSS/JS/SVG asset uncompressed across all
# 7 locales. Text assets compress 60-80%+, cutting payload size and
# time-to-first-render with no behavior change.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/atom+xml image/svg+xml;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://lamar-api.hackatoa.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Clean URLs: /privacy -> privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
