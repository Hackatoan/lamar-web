server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://lamar-api.hackatoa.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Clean URLs: /privacy -> privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
